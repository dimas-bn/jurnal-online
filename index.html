<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E2B22">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jurnal Mengajar">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1E2B22;
      --paper: #F6F2E4;
      --paper-line: #D8CDB0;
      --margin: #A6493C;
      --rule: #B7C6CB;
      --accent: #3E6B52;
      --accent-dark: #2C4E3B;
      --amber: #C08A2E;
      --brick: #B36A3C;
      --slate: #5B6B8C;
      --red: #A63D3D;
      --muted: #6E6252;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--ink);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      background: var(--ink);
      color: var(--paper);
      padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header img {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      flex-shrink: 0;
    }

    header .header-text { min-width: 0; }

    header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-style: italic;
      font-size: 26px;
      margin: 0 0 2px;
      letter-spacing: 0.2px;
    }

    header p {
      margin: 0;
      font-size: 13px;
      color: #C9D6CC;
    }

    nav.tabs {
      display: flex;
      background: var(--accent-dark);
    }

    nav.tabs button {
      flex: 1;
      background: none;
      border: none;
      color: #CFE0D3;
      padding: 15px 4px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    nav.tabs button.active {
      color: #fff;
      border-bottom-color: var(--margin);
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 18px 14px calc(130px + env(safe-area-inset-bottom));
    }

    .page {
      background: var(--paper);
      border-radius: 6px;
      position: relative;
      padding: 22px 20px 22px 44px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 30px,
        var(--paper-line) 31px
      );
      background-position: 0 68px;
    }

    .page::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 28px;
      width: 2px;
      background: var(--margin);
      opacity: 0.55;
    }

    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .tanggal-hari {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 18px;
      color: var(--accent-dark);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      margin: 14px 0 6px;
    }

    input[type="date"],
    input[type="number"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px;
      padding: 11px 10px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .row2 {
      display: flex;
      gap: 12px;
    }
    .row2 > div { flex: 1; }

    .siswa-list {
      margin-top: 8px;
      border-top: 1px solid var(--paper-line);
    }

    .siswa-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--paper-line);
    }

    .siswa-item .nama {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .status-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-group label {
      margin: 0;
      font-weight: 400;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border: 1px solid var(--rule);
      border-radius: 20px;
      cursor: pointer;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    .status-group input { display: none; }

    .status-group label.sel-Hadir { background: var(--accent); color: #fff; border-color: var(--accent); }
    .status-group label.sel-Izin { background: var(--amber); color: #fff; border-color: var(--amber); }
    .status-group label.sel-Sakit { background: var(--brick); color: #fff; border-color: var(--brick); }
    .status-group label.sel-Dispensasi { background: var(--slate); color: #fff; border-color: var(--slate); }
    .status-group label.sel-Alpa { background: var(--red); color: #fff; border-color: var(--red); }

    .ket-input {
      margin-top: 6px;
      display: none;
    }
    .ket-input.show { display: block; }

    .empty-hint {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      padding: 10px 0;
    }

    button.submit {
      margin-top: 0;
      width: 100%;
      background: var(--accent-dark);
      color: #fff;
      border: none;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    button.submit:disabled { opacity: 0.6; cursor: default; }

    .toast {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 5px;
      font-size: 13.5px;
      display: none;
    }
    .toast.ok { background: #E4EEE7; color: var(--accent-dark); display: block; }
    .toast.err { background: #F5E2DF; color: var(--red); display: block; }

    /* RIWAYAT */
    .entry-card {
      border-bottom: 1px solid var(--paper-line);
      padding: 14px 0;
    }
    .entry-card:last-child { border-bottom: none; }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .entry-date {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--accent-dark);
    }

    .entry-kelas {
      font-size: 12.5px;
      color: var(--muted);
    }

    .entry-materi {
      font-size: 14px;
      margin: 4px 0 8px;
    }

    .rekap-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 20px;
      color: #fff;
    }
    .chip.Hadir { background: var(--accent); }
    .chip.Izin { background: var(--amber); }
    .chip.Sakit { background: var(--brick); }
    .chip.Dispensasi { background: var(--slate); }
    .chip.Alpa { background: var(--red); }

    .entry-ket {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .loading { font-size: 13px; color: var(--muted); padding: 12px 0; }

    .filter-bar {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--paper-line);
    }
    .filter-bar select { margin-bottom: 10px; }
    .filter-bar .row2 { margin-bottom: 10px; }
    .reset-filter {
      background: none;
      border: 1px solid var(--rule);
      color: var(--muted);
      font-size: 12.5px;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .no-match { font-size: 13px; color: var(--muted); font-style: italic; padding: 10px 0; }

    .jadwal-suggest {
      margin-top: 14px;
      padding: 10px 12px;
      background: #EFEADA;
      border: 1px dashed var(--rule);
      border-radius: 6px;
    }
    .jadwal-label {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .jadwal-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .jadwal-chip {
      background: var(--accent-dark);
      color: #fff;
      border: none;
      font-size: 12.5px;
      font-family: 'IBM Plex Sans', sans-serif;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .jadwal-chip.used {
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--rule);
    }

    .entry-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .entry-btn {
      background: #fff;
      border: 1px solid var(--rule);
      color: var(--accent-dark);
      font-size: 12.5px;
      font-family: 'IBM Plex Sans', sans-serif;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }
    .entry-btn.danger {
      color: var(--red);
      border-color: #E3C6C1;
    }

    .edit-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #FBF0DD;
      border: 1px solid var(--amber);
      color: #6B4E1A;
      font-size: 12.5px;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .edit-banner button {
      background: var(--amber);
      color: #fff;
      border: none;
      font-size: 12px;
      font-family: 'IBM Plex Sans', sans-serif;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .reminder-banner {
      display: none;
      background: #F5E2DF;
      border: 1px solid var(--red);
      color: #7A2E24;
      font-size: 12.5px;
      line-height: 1.5;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .rekap-summary {
      font-size: 13px;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .rekap-table-wrap { overflow-x: auto; }
    .rekap-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
      font-size: 13px;
    }
    .rekap-table th, .rekap-table td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--paper-line);
      text-align: left;
      white-space: nowrap;
    }
    .rekap-table th {
      font-weight: 600;
      color: var(--accent-dark);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .rekap-table tbody tr:nth-child(even) { background: #EFEADA; }
    .print-btn {
      margin-top: 18px;
      background: var(--accent-dark);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      font-size: 13.5px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    .export-link {
      display: inline-block;
      text-decoration: none;
      margin: 14px 0 4px;
    }
    .export-link.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    @media print {
      header, nav.tabs, .action-bar, #btnTampilkanRekap, .print-btn { display: none !important; }
      body { background: #fff; }
      main { padding: 0; max-width: 100%; }
      .page { box-shadow: none; background: #fff; }
      .page::before { display: none; }
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 400;
      margin-top: 14px;
      cursor: pointer;
    }
    .checkbox-label input { width: auto; margin: 0; }

    .stat-cards {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }
    .stat-card {
      flex: 1;
      background: #fff;
      border: 1px solid var(--paper-line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .stat-card .stat-num {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--accent-dark);
      line-height: 1.1;
    }
    .stat-card .stat-label {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .stat-section-title {
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 22px 0 10px;
    }

    .bar-row { margin-bottom: 10px; }
    .bar-row-top {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
    }
    .bar-track {
      background: #EFEADA;
      height: 9px;
      border-radius: 5px;
      overflow: hidden;
    }
    .bar-fill {
      background: var(--accent);
      height: 100%;
      border-radius: 5px;
    }

    .absen-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--paper-line);
      font-size: 13px;
    }
    .absen-list-item .rank {
      color: var(--muted);
      font-size: 12px;
      width: 20px;
      flex-shrink: 0;
    }
    .absen-list-item .nama-kelas { flex: 1; }
    .absen-list-item .nama-kelas .kelas-kecil {
      color: var(--muted);
      font-size: 11.5px;
    }
    .absen-list-item .total-badge {
      background: var(--red);
      color: #fff;
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    @media (max-width: 380px) {
      .page { padding: 18px 14px 18px 34px; }
      .page::before { left: 20px; }
      header h1 { font-size: 22px; }
      header img { width: 32px; height: 32px; }
      .tanggal-hari { font-size: 18px; }
    }

    .action-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--paper);
      border-top: 1px solid var(--paper-line);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 20px rgba(0,0,0,0.18);
      z-index: 20;
    }
    .action-bar .toast { margin-top: 0; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header>
    <img src="/icon-192.png" alt="">
    <div class="header-text">
      <h1>Jurnal Mengajar</h1>
      <p>Catatan harian pembelajaran & kehadiran siswa</p>
    </div>
  </header>

  <nav class="tabs">
    <button id="tab-isi" class="active" onclick="showTab('isi')">Isi Jurnal</button>
    <button id="tab-riwayat" onclick="showTab('riwayat')">Riwayat</button>
    <button id="tab-rekap" onclick="showTab('rekap')">Rekap</button>
    <button id="tab-statistik" onclick="showTab('statistik')">Statistik</button>
  </nav>

  <main>

    <!-- ===== TAB: ISI JURNAL ===== -->
    <section id="panel-isi" class="page">
      <p class="eyebrow">Hari & tanggal</p>
      <p class="tanggal-hari" id="lblHari">—</p>

      <div id="editBanner" class="edit-banner">
        <span id="editBannerText"></span>
        <button type="button" id="btnBatalEdit">Batal edit</button>
      </div>

      <div id="reminderBanner" class="reminder-banner" style="display:none;">
        <span id="reminderText"></span>
      </div>

      <label for="tanggal">Tanggal</label>
      <input type="date" id="tanggal">

      <div id="jadwalSuggest" class="jadwal-suggest" style="display:none;">
        <p class="jadwal-label">Jadwal hari ini</p>
        <div class="jadwal-chips" id="jadwalChips"></div>
      </div>

      <label for="kelas">Kelas</label>
      <select id="kelas"><option value="">Memuat…</option></select>

      <label>Jam ke- <span style="font-weight:400;color:var(--muted);">(isi "sampai" hanya jika KBM lebih dari 1 JP)</span></label>
      <div class="row2">
        <div>
          <input type="number" inputmode="numeric" id="jamDari" min="1" max="12" placeholder="Dari, mis. 1">
        </div>
        <div>
          <input type="number" inputmode="numeric" id="jamSampai" min="1" max="12" placeholder="Sampai, mis. 3">
        </div>
      </div>

      <label for="mapel">Mata pelajaran</label>
      <input type="text" id="mapel" placeholder="Otomatis terisi dari kelas, bisa diubah">

      <label for="materi">Materi / hal yang perlu dicatat</label>
      <textarea id="materi" placeholder="Contoh: Persamaan kuadrat, latihan soal bab 3..."></textarea>

      <label>Absensi siswa</label>
      <div class="siswa-list" id="siswaList">
        <p class="empty-hint">Pilih kelas dahulu untuk memuat daftar siswa.</p>
      </div>

    </section>

    <!-- ===== TAB: RIWAYAT ===== -->
    <section id="panel-riwayat" class="page" style="display:none;">
      <p class="eyebrow">Catatan tersimpan</p>
      <p class="tanggal-hari">Riwayat Jurnal</p>

      <a id="linkExportExcel" href="#" target="_blank" class="print-btn export-link disabled">📥 Export Semua Data (Excel)</a>

      <div class="filter-bar">
        <select id="filterKelas"><option value="">Semua kelas</option></select>
        <div class="row2">
          <div>
            <input type="date" id="filterDari" aria-label="Dari tanggal">
          </div>
          <div>
            <input type="date" id="filterSampai" aria-label="Sampai tanggal">
          </div>
        </div>
        <button type="button" id="btnResetFilter" class="reset-filter">Reset filter</button>
      </div>

      <div id="riwayatList"><p class="loading">Memuat riwayat…</p></div>
    </section>

    <!-- ===== TAB: REKAP BULANAN ===== -->
    <section id="panel-rekap" class="page" style="display:none;">
      <p class="eyebrow">Laporan kehadiran</p>
      <p class="tanggal-hari">Rekap Bulanan</p>

      <label for="rekapKelas">Kelas</label>
      <select id="rekapKelas"><option value="">Pilih kelas…</option></select>

      <div class="row2">
        <div>
          <label for="rekapBulan">Bulan</label>
          <select id="rekapBulan">
            <option value="1">Januari</option>
            <option value="2">Februari</option>
            <option value="3">Maret</option>
            <option value="4">April</option>
            <option value="5">Mei</option>
            <option value="6">Juni</option>
            <option value="7">Juli</option>
            <option value="8">Agustus</option>
            <option value="9">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>
        <div>
          <label for="rekapTahun">Tahun</label>
          <input type="number" id="rekapTahun" min="2020" max="2100">
        </div>
      </div>

      <button type="button" class="submit" id="btnTampilkanRekap" style="margin-top:18px;">Tampilkan Rekap</button>

      <div id="rekapResult"></div>
    </section>

    <!-- ===== TAB: STATISTIK ===== -->
    <section id="panel-statistik" class="page" style="display:none;">
      <p class="eyebrow">Dashboard ringkas</p>
      <p class="tanggal-hari">Statistik</p>

      <div class="row2">
        <div>
          <label for="statBulan">Bulan</label>
          <select id="statBulan">
            <option value="1">Januari</option>
            <option value="2">Februari</option>
            <option value="3">Maret</option>
            <option value="4">April</option>
            <option value="5">Mei</option>
            <option value="6">Juni</option>
            <option value="7">Juli</option>
            <option value="8">Agustus</option>
            <option value="9">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>
        <div>
          <label for="statTahun">Tahun</label>
          <input type="number" id="statTahun" min="2020" max="2100">
        </div>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="statSemuaWaktu"> Semua waktu (abaikan bulan/tahun)
      </label>

      <button type="button" class="submit" id="btnTampilkanStat" style="margin-top:14px;">Tampilkan Statistik</button>

      <div id="statResult"></div>
    </section>

  </main>

  <div class="action-bar" id="actionBar">
    <div class="toast" id="toast"></div>
    <button class="submit" id="btnSimpan" onclick="simpan()">Simpan Jurnal</button>
  </div>

  <script>
    // ================== KONFIGURASI ==================
    // Tidak lagi manggil Google langsung dari browser (supaya tidak kena CORS).
    // Sebagai gantinya, panggil endpoint /api di domain sendiri, yang diteruskan oleh worker.js ke Apps Script.
    const APPS_SCRIPT_URL = '/api';
    // Harus SAMA PERSIS dengan API_KEY yang ada di Code.gs
    const API_KEY = 'dimest85haysnaidrun';
    // ====================================================

    function callApi(action, extra) {
      const body = Object.assign({ action: action, key: API_KEY }, extra || {});
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
        body: JSON.stringify(body)
      })
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (!json.ok) throw new Error(json.message || 'Terjadi kesalahan di server.');
          return json.data;
        });
    }

    const HARI_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    let daftarKelas = [];
    let jadwalData = [];
    let editingId = null;

    function showTab(tab) {
      document.getElementById('panel-isi').style.display = tab === 'isi' ? 'block' : 'none';
      document.getElementById('panel-riwayat').style.display = tab === 'riwayat' ? 'block' : 'none';
      document.getElementById('panel-rekap').style.display = tab === 'rekap' ? 'block' : 'none';
      document.getElementById('panel-statistik').style.display = tab === 'statistik' ? 'block' : 'none';
      document.getElementById('tab-isi').classList.toggle('active', tab === 'isi');
      document.getElementById('tab-riwayat').classList.toggle('active', tab === 'riwayat');
      document.getElementById('tab-rekap').classList.toggle('active', tab === 'rekap');
      document.getElementById('tab-statistik').classList.toggle('active', tab === 'statistik');
      document.getElementById('actionBar').style.display = tab === 'isi' ? 'block' : 'none';
      if (tab === 'riwayat') muatRiwayat();
      if (tab === 'rekap') isiFilterRekapKelas();
      if (tab === 'statistik') initStatFilter();
    }

    function updateLabelHari() {
      const val = document.getElementById('tanggal').value;
      if (!val) { document.getElementById('lblHari').textContent = '—'; return; }
      const d = new Date(val + 'T00:00:00');
      document.getElementById('lblHari').textContent =
        HARI_ID[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN_ID[d.getMonth()] + ' ' + d.getFullYear();
      updateJadwalSuggest();
    }

    function muatJadwal() {
      callApi('getJadwal').then(function(list) {
        jadwalData = list || [];
        updateJadwalSuggest();
      }).catch(function(err) {
        console.error('Gagal memuat jadwal:', err);
      });
    }

    function cekPengingatHariIni() {
      callApi('getJadwalBelumDiisi', {}).then(function(list) {
        const banner = document.getElementById('reminderBanner');
        if (!list || !list.length) { banner.style.display = 'none'; return; }
        const items = list.map(function(j) { return j.kelas + ' (Jam ' + j.jamKe + ')'; }).join(', ');
        document.getElementById('reminderText').textContent =
          '⏰ Belum diisi hari ini: ' + items + '.';
        banner.style.display = 'block';
      }).catch(function(err) {
        console.error('Gagal cek pengingat:', err);
      });
    }

    function updateJadwalSuggest() {
      const box = document.getElementById('jadwalSuggest');
      const chipsEl = document.getElementById('jadwalChips');
      const val = document.getElementById('tanggal').value;
      if (!val || !jadwalData.length) { box.style.display = 'none'; return; }

      const d = new Date(val + 'T00:00:00');
      const hariIni = HARI_ID[d.getDay()];
      const jadwalHariIni = jadwalData.filter(function(j) { return j.hari === hariIni; });

      if (!jadwalHariIni.length) { box.style.display = 'none'; return; }

      const kelasTerpilih = document.getElementById('kelas').value;
      const jamDariTerisi = document.getElementById('jamDari').value;

      chipsEl.innerHTML = jadwalHariIni.map(function(j, i) {
        const parsed = parseJamKe(j.jamKe);
        const sedangDipakai = kelasTerpilih === j.kelas && jamDariTerisi === parsed.dari;
        return '<button type="button" class="jadwal-chip' + (sedangDipakai ? ' used' : '') + '" data-idx="' + i + '">' +
          escapeHtml(j.kelas) + ' · Jam ' + escapeHtml(j.jamKe) +
        '</button>';
      }).join('');

      chipsEl.querySelectorAll('.jadwal-chip').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const j = jadwalHariIni[Number(btn.getAttribute('data-idx'))];
          const parsed = parseJamKe(j.jamKe);
          document.getElementById('jamDari').value = parsed.dari;
          document.getElementById('jamSampai').value = parsed.sampai;
          const selKelas = document.getElementById('kelas');
          selKelas.value = j.kelas;
          selKelas.dispatchEvent(new Event('change'));
          updateJadwalSuggest();
        });
      });

      box.style.display = 'block';
    }

    function parseJamKe(jamKe) {
      const parts = String(jamKe).split('-');
      return { dari: parts[0] || '', sampai: parts[1] || '' };
    }

    function initTanggal() {
      const today = new Date();
      const iso = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
      document.getElementById('tanggal').value = iso;
      updateLabelHari();
    }
    document.getElementById('tanggal').addEventListener('change', updateLabelHari);

    function muatDaftarKelas() {
      callApi('getDaftarKelas').then(function(list) {
        daftarKelas = list;
        const sel = document.getElementById('kelas');
        sel.innerHTML = '<option value="">Pilih kelas…</option>' +
          list.map(k => '<option value="' + k.kelas + '">' + k.kelas + '</option>').join('');
      }).catch(showErr);
    }

    document.getElementById('kelas').addEventListener('change', function() {
      const kelas = this.value;
      const info = daftarKelas.find(k => k.kelas === kelas);
      document.getElementById('mapel').value = info ? info.mapel : '';
      const listEl = document.getElementById('siswaList');
      if (!kelas) {
        listEl.innerHTML = '<p class="empty-hint">Pilih kelas dahulu untuk memuat daftar siswa.</p>';
        return;
      }
      listEl.innerHTML = '<p class="loading">Memuat siswa…</p>';
      callApi('getSiswaByKelas', { kelas: kelas }).then(function(siswa) {
        renderSiswa(siswa);
      }).catch(function(err) {
        listEl.innerHTML = '<p class="empty-hint">Gagal memuat siswa: ' + escapeHtml(err.message) + '</p>';
      });
      updateJadwalSuggest();
    });

    function renderSiswa(siswa) {
      const listEl = document.getElementById('siswaList');
      if (!siswa.length) {
        listEl.innerHTML = '<p class="empty-hint">Belum ada siswa terdaftar untuk kelas ini di sheet "Siswa".</p>';
        return;
      }
      listEl.innerHTML = siswa.map((s, i) => {
        const name = 'status_' + i;
        return '<div class="siswa-item" data-nama="' + escapeHtml(s.nama) + '">' +
          '<div class="nama">' + (s.noAbsen ? s.noAbsen + '. ' : '') + escapeHtml(s.nama) + '</div>' +
          '<div class="status-group">' +
            ['Hadir','Izin','Sakit','Dispensasi','Alpa'].map(function(st, j) {
              return '<label class="' + (j===0 ? 'sel-Hadir' : '') + '">' +
                '<input type="radio" name="' + name + '" value="' + st + '"' + (j===0?' checked':'') + '>' + st +
                '</label>';
            }).join('') +
          '</div>' +
          '<input type="text" class="ket-input" placeholder="Keterangan (opsional)">' +
        '</div>';
      }).join('');

      // handle status click styling + tampilkan keterangan bila bukan Hadir
      listEl.querySelectorAll('.siswa-item').forEach(function(item) {
        const radios = item.querySelectorAll('input[type=radio]');
        const ketInput = item.querySelector('.ket-input');
        radios.forEach(function(r) {
          r.addEventListener('change', function() {
            item.querySelectorAll('.status-group label').forEach(function(l) {
              l.className = '';
            });
            item.querySelector('input[value="' + r.value + '"]').parentElement.className = 'sel-' + r.value;
            ketInput.classList.toggle('show', r.value !== 'Hadir');
          });
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function simpan() {
      const tanggal = document.getElementById('tanggal').value;
      const kelas = document.getElementById('kelas').value;
      const jamDari = document.getElementById('jamDari').value;
      const jamSampai = document.getElementById('jamSampai').value;
      const mapel = document.getElementById('mapel').value;
      const materi = document.getElementById('materi').value;

      if (!tanggal || !kelas || !jamDari) {
        showToast('err', 'Tanggal, kelas, dan jam ke- (dari) wajib diisi.');
        return;
      }
      if (jamSampai && Number(jamSampai) < Number(jamDari)) {
        showToast('err', 'Jam "sampai" tidak boleh lebih kecil dari jam "dari".');
        return;
      }
      const jamKe = (jamSampai && Number(jamSampai) !== Number(jamDari))
        ? (jamDari + '-' + jamSampai)
        : jamDari;

      const siswaItems = document.querySelectorAll('#siswaList .siswa-item');
      const siswa = Array.from(siswaItems).map(function(item) {
        const checked = item.querySelector('input[type=radio]:checked');
        return {
          nama: item.getAttribute('data-nama'),
          status: checked ? checked.value : 'Hadir',
          keterangan: item.querySelector('.ket-input').value
        };
      });

      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.textContent = editingId ? 'Menyimpan perubahan…' : 'Menyimpan…';

      const payload = { tanggal: tanggal, kelas: kelas, jamKe: jamKe, mapel: mapel, materi: materi, siswa: siswa };
      const apiCall = editingId
        ? callApi('updateJurnal', { id: editingId, payload: payload })
        : callApi('simpanJurnal', { payload: payload });

      apiCall.then(function(res) {
        const sedangEdit = !!editingId;
        editingId = null;
        document.getElementById('editBanner').style.display = 'none';
        btn.disabled = false;
        btn.textContent = 'Simpan Jurnal';
        showToast('ok', (sedangEdit ? 'Perubahan tersimpan — ' : 'Tersimpan — ') + res.hari + ', jurnal & absensi ' + siswa.length + ' siswa berhasil dicatat.');
        document.getElementById('materi').value = '';
        cekPengingatHariIni();
      })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = editingId ? 'Update Jurnal' : 'Simpan Jurnal';
          showErr(err);
        });
    }

    function showToast(kind, msg) {
      const el = document.getElementById('toast');
      el.className = 'toast ' + kind;
      el.textContent = msg;
    }
    function showErr(err) {
      showToast('err', 'Gagal: ' + (err.message || err));
    }

    let riwayatData = [];

    function muatRiwayat() {
      const el = document.getElementById('riwayatList');
      el.innerHTML = '<p class="loading">Memuat riwayat…</p>';
      callApi('getRiwayat').then(function(list) {
        riwayatData = list || [];
        isiFilterKelas();
        renderRiwayatFiltered();
      }).catch(function(err) {
        console.error('Error API getRiwayat:', err);
        el.innerHTML = '<p class="empty-hint">Gagal memuat riwayat: ' + escapeHtml(err.message) + '</p>';
      });
    }

    function isiFilterKelas() {
      const sel = document.getElementById('filterKelas');
      if (sel.dataset.filled) return; // isi sekali saja per load riwayat
      const kelasUnik = Array.from(new Set(riwayatData.map(e => e.kelas))).sort();
      sel.innerHTML = '<option value="">Semua kelas</option>' +
        kelasUnik.map(k => '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>').join('');
      sel.dataset.filled = '1';
    }

    function renderRiwayatFiltered() {
      const kelasFilter = document.getElementById('filterKelas').value;
      const dariFilter = document.getElementById('filterDari').value;
      const sampaiFilter = document.getElementById('filterSampai').value;

      const filtered = riwayatData.filter(function(e) {
        if (kelasFilter && e.kelas !== kelasFilter) return false;
        if (dariFilter && e.tanggalISO < dariFilter) return false;
        if (sampaiFilter && e.tanggalISO > sampaiFilter) return false;
        return true;
      });

      renderRiwayat(filtered, riwayatData.length);
    }

    function renderRiwayat(list, totalSemua) {
      try {
        const el = document.getElementById('riwayatList');
        if (!riwayatData.length) {
          el.innerHTML = '<p class="empty-hint">Belum ada jurnal tersimpan.</p>';
          return;
        }
        if (!list.length) {
          el.innerHTML = '<p class="no-match">Tidak ada jurnal yang cocok dengan filter ini.</p>';
          return;
        }
        el.innerHTML = list.map(function(e) {
          const rekap = e.rekap || {};
          return '<div class="entry-card">' +
            '<div class="entry-top"><span class="entry-date">' + (e.hari || '') + ', ' + (e.tanggal || '') + '</span>' +
            '<span class="entry-kelas">' + escapeHtml(e.kelas || '') + ' · Jam ke-' + (e.jamKe || '') + '</span></div>' +
            '<div class="entry-materi">' + escapeHtml(e.materi || '(tanpa catatan materi)') + '</div>' +
            '<div class="rekap-chips">' +
              ['Hadir','Izin','Sakit','Dispensasi','Alpa'].map(function(st) {
                return '<span class="chip ' + st + '">' + st + ' ' + (rekap[st] || 0) + '</span>';
              }).join('') +
            '</div>' +
            (e.keteranganTidakHadir ? '<div class="entry-ket">' + escapeHtml(e.keteranganTidakHadir) + '</div>' : '') +
            '<div class="entry-actions">' +
              '<button type="button" class="entry-btn" data-action="edit" data-id="' + escapeHtml(e.id) + '">Edit</button>' +
              '<button type="button" class="entry-btn danger" data-action="hapus" data-id="' + escapeHtml(e.id) + '">Hapus</button>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch (clientErr) {
        console.error('Error merender riwayat:', clientErr, list);
        document.getElementById('riwayatList').innerHTML = '<p class="empty-hint">Gagal menampilkan riwayat: ' + escapeHtml(clientErr.message) + '</p>';
      }
    }

    document.getElementById('filterKelas').addEventListener('change', renderRiwayatFiltered);
    document.getElementById('filterDari').addEventListener('change', renderRiwayatFiltered);
    document.getElementById('filterSampai').addEventListener('change', renderRiwayatFiltered);
    document.getElementById('btnResetFilter').addEventListener('click', function() {
      document.getElementById('filterKelas').value = '';
      document.getElementById('filterDari').value = '';
      document.getElementById('filterSampai').value = '';
      renderRiwayatFiltered();
    });

    document.getElementById('riwayatList').addEventListener('click', function(ev) {
      const btn = ev.target.closest('button[data-action]');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      if (btn.getAttribute('data-action') === 'edit') mulaiEdit(id);
      else if (btn.getAttribute('data-action') === 'hapus') hapusJurnalUI(id);
    });

    function mulaiEdit(id) {
      callApi('getJurnalDetail', { id: id }).then(function(detail) {
        editingId = id;
        showTab('isi');

        document.getElementById('editBanner').style.display = 'flex';
        document.getElementById('editBannerText').textContent =
          'Mengedit jurnal ' + detail.kelas + ' — perubahan akan menimpa data lama saat disimpan.';
        document.getElementById('btnSimpan').textContent = 'Update Jurnal';

        document.getElementById('tanggal').value = detail.tanggalISO;
        updateLabelHari();

        const parsed = parseJamKe(detail.jamKe);
        document.getElementById('jamDari').value = parsed.dari;
        document.getElementById('jamSampai').value = parsed.sampai;
        document.getElementById('mapel').value = detail.mapel;
        document.getElementById('materi').value = detail.materi;
        document.getElementById('kelas').value = detail.kelas;

        const listEl = document.getElementById('siswaList');
        listEl.innerHTML = '<p class="loading">Memuat siswa…</p>';
        callApi('getSiswaByKelas', { kelas: detail.kelas }).then(function(siswa) {
          renderSiswa(siswa);
          applyEditStatuses(detail.siswa);
        }).catch(function(err) {
          listEl.innerHTML = '<p class="empty-hint">Gagal memuat siswa: ' + escapeHtml(err.message) + '</p>';
        });

        updateJadwalSuggest();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }).catch(function(err) {
        alert('Gagal memuat data jurnal: ' + err.message);
      });
    }

    function applyEditStatuses(siswaDenganStatus) {
      const map = {};
      siswaDenganStatus.forEach(function(s) { map[s.nama] = s; });
      document.querySelectorAll('#siswaList .siswa-item').forEach(function(item) {
        const info = map[item.getAttribute('data-nama')];
        if (!info) return;
        const radio = item.querySelector('input[type=radio][value="' + info.status + '"]');
        if (radio) {
          radio.checked = true;
          radio.dispatchEvent(new Event('change'));
        }
        if (info.keterangan) {
          item.querySelector('.ket-input').value = info.keterangan;
        }
      });
    }

    function resetForm() {
      editingId = null;
      document.getElementById('editBanner').style.display = 'none';
      document.getElementById('btnSimpan').textContent = 'Simpan Jurnal';
      document.getElementById('kelas').value = '';
      document.getElementById('mapel').value = '';
      document.getElementById('jamDari').value = '';
      document.getElementById('jamSampai').value = '';
      document.getElementById('materi').value = '';
      document.getElementById('siswaList').innerHTML = '<p class="empty-hint">Pilih kelas dahulu untuk memuat daftar siswa.</p>';
      updateJadwalSuggest();
    }
    document.getElementById('btnBatalEdit').addEventListener('click', resetForm);

    function hapusJurnalUI(id) {
      if (!confirm('Yakin hapus jurnal ini? Data absensi terkait juga akan terhapus, dan tidak bisa dikembalikan.')) return;
      callApi('hapusJurnal', { id: id }).then(function() {
        riwayatData = riwayatData.filter(function(e) { return e.id !== id; });
        renderRiwayatFiltered();
        if (editingId === id) resetForm();
        cekPengingatHariIni();
      }).catch(function(err) {
        alert('Gagal menghapus: ' + err.message);
      });
    }

    function isiFilterRekapKelas() {
      const sel = document.getElementById('rekapKelas');
      if (!sel.dataset.filled && daftarKelas.length) {
        sel.innerHTML = '<option value="">Pilih kelas…</option>' +
          daftarKelas.map(function(k) { return '<option value="' + escapeHtml(k.kelas) + '">' + escapeHtml(k.kelas) + '</option>'; }).join('');
        sel.dataset.filled = '1';
      }
      if (!document.getElementById('rekapTahun').value) {
        const now = new Date();
        document.getElementById('rekapBulan').value = String(now.getMonth() + 1);
        document.getElementById('rekapTahun').value = now.getFullYear();
      }
    }

    function tampilkanRekap() {
      const kelas = document.getElementById('rekapKelas').value;
      const bulan = document.getElementById('rekapBulan').value;
      const tahun = document.getElementById('rekapTahun').value;
      const resultEl = document.getElementById('rekapResult');

      if (!kelas) {
        resultEl.innerHTML = '<p class="empty-hint">Pilih kelas dahulu.</p>';
        return;
      }
      resultEl.innerHTML = '<p class="loading">Menghitung rekap…</p>';

      callApi('getRekapBulanan', { kelas: kelas, bulan: bulan, tahun: tahun }).then(function(data) {
        renderRekap(data);
      }).catch(function(err) {
        resultEl.innerHTML = '<p class="empty-hint">Gagal memuat rekap: ' + escapeHtml(err.message) + '</p>';
      });
    }
    document.getElementById('btnTampilkanRekap').addEventListener('click', tampilkanRekap);

    function renderRekap(data) {
      const resultEl = document.getElementById('rekapResult');
      const namaBulan = BULAN_ID[data.bulan - 1];

      if (!data.totalPertemuan) {
        resultEl.innerHTML = '<p class="empty-hint">Belum ada jurnal untuk ' + escapeHtml(data.kelas) + ' di bulan ' + namaBulan + ' ' + data.tahun + '.</p>';
        return;
      }
      if (!data.siswa.length) {
        resultEl.innerHTML = '<p class="empty-hint">Belum ada siswa terdaftar untuk kelas ini di sheet "Siswa".</p>';
        return;
      }

      const rows = data.siswa.map(function(s, i) {
        const persenHadir = data.totalPertemuan ? Math.round((s.Hadir / data.totalPertemuan) * 100) : 0;
        return '<tr>' +
          '<td>' + (s.noAbsen || (i + 1)) + '</td>' +
          '<td>' + escapeHtml(s.nama) + '</td>' +
          '<td>' + s.Hadir + '</td>' +
          '<td>' + s.Izin + '</td>' +
          '<td>' + s.Sakit + '</td>' +
          '<td>' + s.Dispensasi + '</td>' +
          '<td>' + s.Alpa + '</td>' +
          '<td>' + persenHadir + '%</td>' +
        '</tr>';
      }).join('');

      resultEl.innerHTML =
        '<p class="rekap-summary">' + escapeHtml(data.kelas) + ' — ' + namaBulan + ' ' + data.tahun + ' · Total pertemuan: ' + data.totalPertemuan + ' kali</p>' +
        '<div class="rekap-table-wrap"><table class="rekap-table"><thead><tr>' +
          '<th>No</th><th>Nama</th><th>H</th><th>I</th><th>S</th><th>D</th><th>A</th><th>% Hadir</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<button type="button" class="print-btn" onclick="window.print()">🖨️ Cetak / Simpan sebagai PDF</button>';
    }

    function initStatFilter() {
      if (!document.getElementById('statTahun').value) {
        const now = new Date();
        document.getElementById('statBulan').value = String(now.getMonth() + 1);
        document.getElementById('statTahun').value = now.getFullYear();
      }
    }

    document.getElementById('btnTampilkanStat').addEventListener('click', tampilkanStatistik);
    document.getElementById('statSemuaWaktu').addEventListener('change', function() {
      const disabled = this.checked;
      document.getElementById('statBulan').disabled = disabled;
      document.getElementById('statTahun').disabled = disabled;
    });

    function tampilkanStatistik() {
      const bulan = document.getElementById('statBulan').value;
      const tahun = document.getElementById('statTahun').value;
      const semuaWaktu = document.getElementById('statSemuaWaktu').checked;
      const resultEl = document.getElementById('statResult');

      resultEl.innerHTML = '<p class="loading">Menghitung statistik…</p>';

      callApi('getStatistik', { bulan: bulan, tahun: tahun, semuaWaktu: semuaWaktu }).then(function(data) {
        renderStatistik(data, semuaWaktu, bulan, tahun);
      }).catch(function(err) {
        resultEl.innerHTML = '<p class="empty-hint">Gagal memuat statistik: ' + escapeHtml(err.message) + '</p>';
      });
    }

    function renderStatistik(data, semuaWaktu, bulan, tahun) {
      const resultEl = document.getElementById('statResult');

      if (!data.totalPertemuan) {
        const periodeTxt = semuaWaktu ? 'sepanjang waktu' : ('di ' + BULAN_ID[Number(bulan) - 1] + ' ' + tahun);
        resultEl.innerHTML = '<p class="empty-hint">Belum ada jurnal tercatat ' + periodeTxt + '.</p>';
        return;
      }

      const maxPertemuan = Math.max.apply(null, data.pertemuanPerKelas.map(function(k) { return k.jumlah; }));

      const cardsHtml =
        '<div class="stat-cards">' +
          '<div class="stat-card"><div class="stat-num">' + data.totalPertemuan + '</div><div class="stat-label">Total pertemuan</div></div>' +
          '<div class="stat-card"><div class="stat-num">' + data.rataRataKehadiran + '%</div><div class="stat-label">Rata-rata kehadiran</div></div>' +
        '</div>';

      const barsHtml =
        '<p class="stat-section-title">Pertemuan per kelas</p>' +
        data.pertemuanPerKelas.map(function(k) {
          const pct = maxPertemuan ? Math.round((k.jumlah / maxPertemuan) * 100) : 0;
          return '<div class="bar-row">' +
            '<div class="bar-row-top"><span>' + escapeHtml(k.kelas) + '</span><span>' + k.jumlah + 'x</span></div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div>' +
          '</div>';
        }).join('');

      const topHtml = !data.topTidakHadir.length
        ? '<p class="empty-hint">Belum ada catatan ketidakhadiran pada periode ini — semua siswa hadir terus.</p>'
        : '<p class="stat-section-title">Siswa paling sering tidak hadir</p>' +
          data.topTidakHadir.map(function(s, i) {
            return '<div class="absen-list-item">' +
              '<span class="rank">#' + (i + 1) + '</span>' +
              '<span class="nama-kelas">' + escapeHtml(s.nama) + '<br><span class="kelas-kecil">' + escapeHtml(s.kelas) +
                ' · I:' + s.Izin + ' S:' + s.Sakit + ' D:' + s.Dispensasi + ' A:' + s.Alpa + '</span></span>' +
              '<span class="total-badge">' + s.total + 'x</span>' +
            '</div>';
          }).join('');

      resultEl.innerHTML = cardsHtml + barsHtml + topHtml;
    }

    function muatLinkExport() {
      callApi('getExportUrl').then(function(url) {
        const link = document.getElementById('linkExportExcel');
        link.href = url;
        link.classList.remove('disabled');
      }).catch(function(err) {
        console.error('Gagal memuat link export:', err);
      });
    }

    initTanggal();
    muatDaftarKelas();
    muatJadwal();
    cekPengingatHariIni();
    muatLinkExport();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.error('Gagal mendaftarkan service worker:', err);
        });
      });
    }
  </script>

</body>
</html>
